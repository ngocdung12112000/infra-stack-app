apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: identity
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
