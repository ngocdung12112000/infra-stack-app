apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
    # Same port as the compose setup (http://identity:8080) so gateway config is identical locally and in-cluster.
    - name: http-8080
      port: 8080
      targetPort: http
