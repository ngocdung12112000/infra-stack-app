# Applies EF Core migrations before the new pods roll out. ArgoCD deletes the previous Job
# (BeforeHookCreation) and recreates it on every sync, so it always runs against the new image tag.
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
  labels:
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: identity
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/ngocdung12112000/stackshop-identity
          args: ["migrate"] # image ENTRYPOINT is `dotnet Identity.Api.dll`
          envFrom:
            - configMapRef:
                name: identity-config
          env:
            - name: ConnectionStrings__Identity
              valueFrom: { secretKeyRef: { name: identity-secrets, key: ConnectionStrings__Identity } }
            - name: Redis__ConnectionString
              valueFrom: { secretKeyRef: { name: identity-secrets, key: Redis__ConnectionString } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
