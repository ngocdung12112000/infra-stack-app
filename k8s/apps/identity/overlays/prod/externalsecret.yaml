# Prod secrets come from AWS Secrets Manager through External Secrets Operator. No values live in git,
# only the remote key names. The ClusterSecretStore is defined in k8s/platform (external-secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: identity-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: identity-secrets
    creationPolicy: Owner
  data:
    - { secretKey: ConnectionStrings__Identity, remoteRef: { key: stackshop/prod/identity, property: connection_string } }
    - { secretKey: Redis__ConnectionString, remoteRef: { key: stackshop/prod/identity, property: redis_connection_string } }
    - { secretKey: Email__Username, remoteRef: { key: stackshop/prod/identity, property: smtp_username } }
    - { secretKey: Email__Password, remoteRef: { key: stackshop/prod/identity, property: smtp_password } }
    - { secretKey: signing-private-key.pem, remoteRef: { key: stackshop/prod/identity, property: signing_private_key_pem } }
  # Optional keys for signing key rotation (add remote properties, then list them here):
  #   Signing__KeyId, Signing__RetiredPublicKeyPems__0
