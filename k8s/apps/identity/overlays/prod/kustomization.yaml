apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stackshop
resources:
  - ../../base
  - externalsecret.yaml
images:
  - name: ghcr.io/ngocdung12112000/stackshop-identity
    newTag: bootstrap # promotion PR copies the staging tag here (CODEOWNERS approval required)
patches:
  - target: { kind: ConfigMap, name: identity-config }
    patch: |-
      - op: replace
        path: /data/Auth__FrontendBaseUrl
        value: https://shop.stackshop.example
      - op: replace
        path: /data/Email__Host
        value: smtp.stackshop.example
      - op: replace
        path: /data/Email__Port
        value: "587"
      - op: replace
        path: /data/Email__UseStartTls
        value: "true"
      - op: replace
        path: /data/Email__FromAddress
        value: no-reply@stackshop.example
  - target: { kind: HorizontalPodAutoscaler, name: identity }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target: { kind: Deployment, name: identity }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
