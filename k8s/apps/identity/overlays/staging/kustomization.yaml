apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stackshop
resources:
  - ../../base
  - sealedsecret.yaml
images:
  - name: ghcr.io/ngocdung12112000/stackshop-identity
    newTag: bootstrap # CI bumps this line (tag = git sha); promotion copies it from dev
patches:
  - target: { kind: ConfigMap, name: identity-config }
    patch: |-
      - op: replace
        path: /data/Auth__FrontendBaseUrl
        value: https://shop.staging.stackshop.local
      - op: replace
        path: /data/Email__Host
        value: smtp.staging.stackshop.local
      - op: replace
        path: /data/Email__Port
        value: "587"
      - op: replace
        path: /data/Email__UseStartTls
        value: "true"
      - op: add
        path: /data/Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore
        value: Warning
