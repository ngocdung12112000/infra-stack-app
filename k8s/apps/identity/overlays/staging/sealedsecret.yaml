# PLACEHOLDER. A SealedSecret can only be produced against the staging cluster's controller key, so the
# encryptedData below is intentionally empty and the sync will not yield a usable Secret until it is sealed:
#   kubeseal --controller-namespace sealed-secrets -n stackshop --name identity-secrets -o yaml < identity-secrets.plain.yaml
# (see ../../README.md for the keys). Never commit the plain Secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: identity-secrets
spec:
  encryptedData: {}
  template:
    metadata:
      name: identity-secrets
