apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stackshop
resources:
  - ../../base
  # identity-secrets (plain Secret or SealedSecret) is created out of band in dev, see ../../README.md
images:
  - name: ghcr.io/ngocdung12112000/stackshop-identity
    newTag: bootstrap # CI bumps this line (tag = git sha)
patches:
  # dev: 1 replica, no autoscaling, no PDB (a PDB with 1 replica blocks node drains)
  - target: { kind: HorizontalPodAutoscaler, name: identity }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: identity
  - target: { kind: PodDisruptionBudget, name: identity }
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: identity
  - target: { kind: Deployment, name: identity }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: { cpu: 50m, memory: 128Mi }
  - target: { kind: ConfigMap, name: identity-config }
    patch: |-
      - op: replace
        path: /data/Auth__FrontendBaseUrl
        value: http://shop.stackshop.local
