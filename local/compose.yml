name: stackshop-infra

networks:
  default:
    name: stackshop

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  grafana-data:

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      retries: 10

  mongo:
    image: mongo:7
    # Single-node replica set (required for multi-document transactions). No auth in local dev.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./init/mongo:/init/mongo:ro
    healthcheck:
      # Idempotently rs.initiate()s on first run, then succeeds once PRIMARY.
      test: ["CMD", "mongosh", "--quiet", "/init/mongo/rs-init.js"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    # --web.enable-lifecycle lets `curl -X POST localhost:9090/-/reload` pick up config/rule changes
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports: ["3030:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/dashboards:/var/lib/grafana/dashboards:ro
