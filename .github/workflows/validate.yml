name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local compose
        run: docker compose -f local/compose.yml config -q

  prometheus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Prometheus config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/cfg:ro" \
            prom/prometheus:latest check config /cfg/prometheus.yml

  k8s:
    # k8s/ is empty in Phase 0; kubeconform + kustomize checks are added with the first manifests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Placeholder check
        run: test -d k8s
