# K8s packaging of the monitoring assets (applied to the monitoring namespace by an ArgoCD app).
# Dashboards become ConfigMaps picked up by the Grafana sidecar (label grafana_dashboard=1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rules/identity.rules.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: StackShop
configMapGenerator:
  - name: dashboard-identity-auth
    files:
      - identity-auth.json=dashboards/identity-auth.json
