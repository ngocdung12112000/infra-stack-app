global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # Backend services (stackshop-backend/docker-compose.yml, same "stackshop" network).
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: catalog
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog:8080"]
